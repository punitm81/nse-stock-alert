name: NSE Universe Refresh

on:
  schedule:
    # 14:30 UTC Sunday = 20:00 IST Sunday, weekly
    - cron: "30 14 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nse-stock-alert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Scans every NSE equity's market cap -- can take 15-30+ minutes.
      - run: python build_universe.py
        timeout-minutes: 60

      - name: Commit updated universe list
        run: |
          git add data/universe.json
          if git diff --cached --quiet; then
            echo "No change to universe.json."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh NSE market-cap universe list [skip ci]"
            git push
          fi
